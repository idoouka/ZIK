<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecteur Perso</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15120f">
<style>
:root{
  --bg:#15120f; --surface:#1f1a15; --surface2:#2a231c; --text:#f2ece3; --text-dim:#a89a8a;
  --accent:#e2a640; --accent-contrast:#15120f; --danger:#e06b66; --border:#332b22;
  box-sizing:border-box; color-scheme: light dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#faf7f2; --surface:#ffffff; --surface2:#f1ebe1; --text:#201a14; --text-dim:#7a6e5f;
    --accent:#b97a1f; --accent-contrast:#ffffff; --danger:#c0392b; --border:#e7ddcf;
  }
}
:root[data-theme="light"]{
  --bg:#faf7f2; --surface:#ffffff; --surface2:#f1ebe1; --text:#201a14; --text-dim:#7a6e5f;
  --accent:#b97a1f; --accent-contrast:#ffffff; --danger:#c0392b; --border:#e7ddcf;
}
*{box-sizing:border-box;}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
body{height:100%; margin:0; background:var(--bg); color:var(--text); display:flex; flex-direction:column;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);}
header{padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--border);}
h1{font-size:1.05rem; margin:0; font-weight:600; letter-spacing:.2px;}
.addBtn{background:var(--accent); color:var(--accent-contrast); border:none; padding:9px 16px; border-radius:20px; font-size:.85rem; font-weight:600; cursor:pointer;}
input[type=file]{display:none;}
.hint{padding:6px 18px 0; font-size:.75rem; color:var(--text-dim);}
.err{color:var(--danger); font-size:.8rem; padding:6px 18px; min-height:1.1em;}
main{flex:1; overflow-y:auto; padding:8px 12px 190px;}
.empty{color:var(--text-dim); text-align:center; margin-top:50px; font-size:.92rem; line-height:1.5;}
.track{display:flex; align-items:center; justify-content:space-between; padding:13px 12px; border-radius:10px; margin-bottom:5px; background:var(--surface);}
.track.active{background:var(--surface2); box-shadow:inset 3px 0 0 var(--accent);}
.tname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; font-size:.9rem;}
.del{background:none; border:none; color:var(--text-dim); font-size:1rem; cursor:pointer; padding:4px 10px;}
.player{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--border);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));}
#nowTitle{font-size:.85rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:8px;}
.seekRow{display:flex; align-items:center; gap:8px; font-size:.72rem; color:var(--text-dim);}
.seekRow input[type=range]{flex:1; accent-color:var(--accent);}
.controls{display:flex; align-items:center; justify-content:center; gap:28px; margin-top:10px;}
.controls button{background:none; border:none; font-size:1.5rem; color:var(--text); cursor:pointer;}
#playBtn{font-size:1.5rem; width:50px; height:50px; border-radius:50%; background:var(--accent); color:var(--accent-contrast);
  display:flex; align-items:center; justify-content:center;}
.volRow{display:flex; align-items:center; gap:10px; margin-top:8px;}
.volRow input{flex:1; accent-color:var(--accent);}
.brand{display:flex; align-items:center; gap:10px;}
.logo{width:28px; height:28px; border-radius:7px; object-fit:cover;}
.controls button.onBtn{color:var(--accent);}
.controls .mini{font-size:1.1rem;}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="icon-192.png" alt="Logo"><h1>Lecteur Perso</h1></div>
  <label class="addBtn" for="fileInput">+ Ajouter</label>
  <input type="file" id="fileInput" multiple accept="audio/*">
</header>
<p class="hint">Formats fiables : MP3, M4A/AAC, WAV, OGG, FLAC — les autres dépendent de ton téléphone.</p>
<div class="err" id="err"></div>
<main id="list"></main>

<div class="player">
  <div id="nowTitle">Aucune lecture</div>
  <div class="seekRow">
    <span id="curTime">0:00</span>
    <input type="range" id="seek" min="0" max="100" value="0">
    <span id="durTime">0:00</span>
  </div>
  <div class="controls">
    <button id="shuffleBtn" class="mini" aria-label="Lecture aléatoire">🔀</button>
    <button id="prevBtn" aria-label="Précédent">⏮</button>
    <button id="playBtn" aria-label="Lecture">▶</button>
    <button id="nextBtn" aria-label="Suivant">⏭</button>
    <button id="repeatBtn" class="mini" aria-label="Répéter">🔁</button>
  </div>
  <div class="volRow">
    <span>🔊</span>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
  </div>
</div>
<audio id="audio"></audio>

<script>
const DB_NAME='musicdb', STORE='tracks';
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
let db;
async function addTracks(files){
  db=db||await openDB();
  const tx=db.transaction(STORE,'readwrite'), store=tx.objectStore(STORE);
  files.forEach(f=>store.put({id:Date.now()+'-'+Math.random().toString(36).slice(2), name:f.name, blob:f, addedAt:Date.now()}));
  return new Promise(res=>tx.oncomplete=res);
}
async function getTracks(){
  db=db||await openDB();
  return new Promise((res,rej)=>{
    const req=db.transaction(STORE,'readonly').objectStore(STORE).getAll();
    req.onsuccess=()=>res(req.result.sort((a,b)=>a.addedAt-b.addedAt));
    req.onerror=()=>rej(req.error);
  });
}
async function deleteTrackDB(id){
  db=db||await openDB();
  const tx=db.transaction(STORE,'readwrite');
  tx.objectStore(STORE).delete(id);
  return new Promise(res=>tx.oncomplete=res);
}

let tracks=[], currentIndex=-1, currentURL=null;
const audio=document.getElementById('audio'), listEl=document.getElementById('list'),
  titleEl=document.getElementById('nowTitle'), playBtn=document.getElementById('playBtn'),
  seek=document.getElementById('seek'), curTime=document.getElementById('curTime'),
  durTime=document.getElementById('durTime'), fileInput=document.getElementById('fileInput'),
  errEl=document.getElementById('err');

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function refresh(){ tracks=await getTracks(); renderList(); }

function renderList(){
  listEl.innerHTML='';
  if(tracks.length===0){
    listEl.innerHTML='<p class="empty">Aucune musique pour le moment.<br>Ajoute tes fichiers audio ci-dessus.</p>';
    return;
  }
  tracks.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='track'+(i===currentIndex?' active':'');
    row.innerHTML='<span class="tname">'+esc(t.name)+'</span><button class="del" aria-label="Supprimer">✕</button>';
    row.querySelector('.tname').onclick=()=>playIndex(i);
    row.querySelector('.del').onclick=e=>{e.stopPropagation(); removeTrack(t.id,i);};
    listEl.appendChild(row);
  });
}

async function removeTrack(id,i){
  await deleteTrackDB(id);
  if(i===currentIndex){ audio.pause(); audio.removeAttribute('src'); currentIndex=-1; titleEl.textContent='Aucune lecture'; }
  else if(i<currentIndex){ currentIndex--; }
  await refresh();
}

function playIndex(i){
  const t=tracks[i]; if(!t) return;
  if(currentURL) URL.revokeObjectURL(currentURL);
  currentURL=URL.createObjectURL(t.blob);
  audio.src=currentURL; currentIndex=i; errEl.textContent='';
  audio.play().catch(()=>{});
  titleEl.textContent=t.name;
  renderList();
}

playBtn.onclick=()=>{
  if(!audio.src){ if(tracks.length) playIndex(0); return; }
  if(audio.paused) audio.play(); else audio.pause();
};
let shuffle=false, repeatMode='none';
const shuffleBtn=document.getElementById('shuffleBtn'), repeatBtn=document.getElementById('repeatBtn');
function randomExcluding(ex){ if(tracks.length<=1) return ex; let i; do{i=Math.floor(Math.random()*tracks.length);}while(i===ex); return i; }
function sequentialNext(){ if(currentIndex<tracks.length-1) return currentIndex+1; if(repeatMode==='all') return 0; return -1; }
function sequentialPrev(){ if(currentIndex>0) return currentIndex-1; if(repeatMode==='all') return tracks.length-1; return -1; }
function manualNext(){ const i=shuffle?randomExcluding(currentIndex):sequentialNext(); if(i>=0) playIndex(i); }
function manualPrev(){ const i=shuffle?randomExcluding(currentIndex):sequentialPrev(); if(i>=0) playIndex(i); }
shuffleBtn.onclick=()=>{ shuffle=!shuffle; shuffleBtn.classList.toggle('onBtn',shuffle); };
function updateRepeatBtn(){ repeatBtn.textContent=repeatMode==='one'?'🔂':'🔁'; repeatBtn.classList.toggle('onBtn',repeatMode!=='none'); }
repeatBtn.onclick=()=>{ repeatMode=repeatMode==='none'?'all':repeatMode==='all'?'one':'none'; updateRepeatBtn(); };
document.getElementById('prevBtn').onclick=manualPrev;
document.getElementById('nextBtn').onclick=manualNext;

audio.addEventListener('play',()=>playBtn.textContent='⏸');
audio.addEventListener('pause',()=>playBtn.textContent='▶');
audio.addEventListener('timeupdate',()=>{
  if(audio.duration){ seek.value=(audio.currentTime/audio.duration)*100; curTime.textContent=fmt(audio.currentTime); durTime.textContent=fmt(audio.duration); }
});
audio.addEventListener('ended',()=>{ if(repeatMode==='one'){ playIndex(currentIndex); return; } manualNext(); });
audio.addEventListener('error',()=>{
  const name=tracks[currentIndex]?tracks[currentIndex].name:'';
  errEl.textContent='Ce format audio n’est pas lisible sur cet appareil : '+name;
  if(currentIndex<tracks.length-1) setTimeout(()=>playIndex(currentIndex+1),900);
});

seek.addEventListener('input',()=>{ if(audio.duration) audio.currentTime=(seek.value/100)*audio.duration; });
document.getElementById('vol').addEventListener('input',e=>{ audio.volume=e.target.value; });

function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

fileInput.addEventListener('change', async e=>{
  const files=Array.from(e.target.files);
  if(!files.length) return;
  await addTracks(files);
  fileInput.value='';
  await refresh();
});

refresh();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
